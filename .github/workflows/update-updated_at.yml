name: Update updated_at date
on:
  push:
    paths:
      - "**/*.md"
jobs:
  update-date:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Check for changes in .md files
        run: |
          git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | grep '\.md$' || echo "No markdown files changed"
      - name: List commits before and after
        run: |
          git log --oneline -n 5
      - name: Update dates in .md files
        run: |
          TODAY=$(date +%Y-%m-%d)
          for file in $(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '\.md$'); do
            echo "Processing $file"

            # Update existing updated_at
            if grep -q "^updated_at:" "$file"; then
              sed -i "s/^updated_at: [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}/updated_at: $TODAY/" "$file"

            # Append updated_at after created_at if missing
            elif grep -q "^created_at:" "$file"; then
              sed -i "/^created_at:/a updated_at: $TODAY" "$file"

            fi

            # Add created_at after title if missing
            if ! grep -q "^created_at:" "$file"; then
              sed -i "/^title:/a created_at: $TODAY" "$file"
            fi

          done
      - name: Commit changes if any
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add .
            git commit -m "Update date fields in modified files (workflow: update-updated_at.yml)"
            git push
          fi
